  <rect x="37" y="22" width="11" height="11" fill="white" stroke="#000" stroke-width="0.5"/>
  <!-- Top-right quadrant -->
  <rect x="52" y="22" width="11" height="11" fill="white" stroke="#000" stroke-width="0.5"/>
  <!-- Bottom-left quadrant -->
  <rect x="37" y="37" width="11" height="11" fill="white" stroke="#000" stroke-width="0.5"/>
  <!-- Bottom-right quadrant -->
  <rect x="52" y="37" width="11" height="11" fill="white" stroke="#000" stroke-width="0.5"/>
  
  <!-- Cross in center -->
  <rect x="48" y="20" width="4" height="20" fill="#FFD700"/>
