<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="48" fill="#006400" stroke="#000" stroke-width="2"/>
  
  <!-- Inner white circle -->
  <circle cx="50" cy="50" r="40" fill="white"/>
  
  <!-- Shield shape -->
  <path d="M 50 15 L 65 25 L 65 45 Q 65 55 50 65 Q 35 55 35 45 L 35 25 Z" fill="#006400" stroke="#000" stroke-width="1"/>
  
  <!-- Shield quadrants -->
