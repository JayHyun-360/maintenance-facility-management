<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB347;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Sky background -->
  <rect width="48" height="48" rx="8" fill="url(#skyGradient)"/>
  <!-- Sun -->
  <circle cx="24" cy="22" r="10" fill="url(#sunGradient)"/>
  <!-- Sun rays -->
  <g stroke="#FFD700" stroke-width="2" stroke-linecap="round">
    <line x1="24" y1="6" x2="24" y2="10"/>
    <line x1="24" y1="34" x2="24" y2="38"/>
    <line x1="8" y1="22" x2="12" y2="22"/>
    <line x1="36" y1="22" x2="40" y2="22"/>
    <line x1="12.3" y1="10.3" x2="15.2" y2="13.2"/>
    <line x1="32.7" y1="30.7" x2="35.6" y2="33.6"/>
    <line x1="12.3" y1="33.7" x2="15.2" y2="30.8"/>
    <line x1="32.7" y1="13.3" x2="35.6" y2="10.4"/>
  </g>
  <!-- Horizon line / ground hint -->
  <ellipse cx="24" cy="42" rx="18" ry="3" fill="#90EE90" opacity="0.6"/>
</svg>
