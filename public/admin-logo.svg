<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3D6B35"/>
      <stop offset="100%" style="stop-color:#2D5016"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5D9C59"/>
      <stop offset="100%" style="stop-color:#7CB342"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Inner ring -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Gear/Wrench hybrid icon representing maintenance -->
  <g transform="translate(60, 60)">
    <!-- Main gear body -->
    <circle cx="0" cy="0" r="18" fill="url(#iconGrad)"/>
    
    <!-- Gear teeth -->
    <g fill="url(#iconGrad)">
      <rect x="-4" y="-28" width="8" height="10" rx="2"/>
      <rect x="-4" y="18" width="8" height="10" rx="2"/>
      <rect x="-28" y="-4" width="10" height="8" rx="2"/>
      <rect x="18" y="-4" width="10" height="8" rx="2"/>
      <rect x="-20" y="-20" width="8" height="8" rx="1.5" transform="rotate(45)"/>
      <rect x="12" y="-20" width="8" height="8" rx="1.5" transform="rotate(-45)"/>
      <rect x="-20" y="12" width="8" height="8" rx="1.5" transform="rotate(-45)"/>
      <rect x="12" y="12" width="8" height="8" rx="1.5" transform="rotate(45)"/>
    </g>
    
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="10" fill="#2D5016"/>
    
    <!-- Wrench opening -->
    <path d="M-6 -2 L-3 -5 L3 -5 L6 -2 L6 2 L3 5 L-3 5 L-6 2 Z" fill="url(#iconGrad)"/>
    <circle cx="0" cy="0" r="3" fill="#2D5016"/>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="25" cy="35" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="95" cy="85" r="2" fill="rgba(255,255,255,0.2)"/>
  <circle cx="30" cy="90" r="2.5" fill="rgba(255,255,255,0.25)"/>
</svg>
