<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular frame with gradient -->
  <defs>
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#427A43;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a2e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Outer circle frame -->
  <circle cx="50" cy="50" r="45" fill="url(#frameGradient)" opacity="0.9"/>
  <circle cx="50" cy="50" r="42" fill="white" opacity="0.95"/>
  <circle cx="50" cy="50" r="38" fill="#f8f9fa"/>
  
  <!-- Broom handle -->
  <rect x="47" y="15" width="6" height="35" fill="#8B4513" rx="1"/>
  
  <!-- Broom bristles -->
  <g transform="translate(50, 50)">
    <!-- Main broom head -->
    <rect x="-8" y="0" width="16" height="8" fill="#D2691E" rx="1"/>
    
    <!-- Bristles -->
    <rect x="-7" y="8" width="2" height="12" fill="#654321" rx="0.5"/>
    <rect x="-4" y="8" width="2" height="13" fill="#654321" rx="0.5"/>
    <rect x="-1" y="8" width="2" height="14" fill="#654321" rx="0.5"/>
    <rect x="2" y="8" width="2" height="13" fill="#654321" rx="0.5"/>
    <rect x="5" y="8" width="2" height="12" fill="#654321" rx="0.5"/>
  </g>
  
  <!-- Dust particles -->
  <g filter="url(#shadow)">
    <!-- Particle 1 -->
    <circle cx="25" cy="35" r="3" fill="#888" opacity="0.7">
      <animate attributeName="cy" values="35;33;35" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Particle 2 -->
    <circle cx="75" cy="40" r="2.5" fill="#999" opacity="0.6">
      <animate attributeName="cy" values="40;38;40" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Particle 3 -->
    <circle cx="30" cy="65" r="2" fill="#777" opacity="0.5">
      <animate attributeName="cy" values="65;63;65" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Cleaning effect lines -->
  <g stroke="#427A43" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M 20 70 Q 35 65, 50 68">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 50 68 Q 65 70, 80 65">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
