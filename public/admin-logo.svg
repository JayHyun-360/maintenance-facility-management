<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Multi-stop gradients for depth -->
    <linearGradient id="outerRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a9f5c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#427A43;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a2e;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="innerBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#f8fbf8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#e8f5e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4ead4;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="broomHandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a0522d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="broomHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#daa520;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D2691E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Advanced shadow filters -->
    <filter id="logoShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer decorative ring -->
  <circle cx="60" cy="60" r="55" fill="url(#outerRing)" filter="url(#logoShadow)"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Inner background with radial gradient -->
  <circle cx="60" cy="60" r="48" fill="url(#innerBg)" filter="url(#innerShadow)"/>
  
  <!-- Decorative inner ring -->
  <circle cx="60" cy="60" r="45" fill="none" stroke="#427A43" stroke-width="1" opacity="0.3" stroke-dasharray="2,1"/>
  
  <!-- Enhanced broom handle with wood grain effect -->
  <g filter="url(#innerShadow)">
    <rect x="57" y="18" width="6" height="38" fill="url(#broomHandle)" rx="1.5"/>
    <!-- Wood grain lines -->
    <line x1="58" y1="25" x2="58" y2="50" stroke="#654321" stroke-width="0.3" opacity="0.4"/>
    <line x1="59.5" y1="22" x2="59.5" y2="52" stroke="#8B4513" stroke-width="0.2" opacity="0.3"/>
    <line x1="61" y1="28" x2="61" y2="48" stroke="#654321" stroke-width="0.3" opacity="0.4"/>
    <line x1="62" y1="30" x2="62" y2="45" stroke="#8B4513" stroke-width="0.2" opacity="0.3"/>
  </g>
  
  <!-- Enhanced broom head -->
  <g transform="translate(60, 56)" filter="url(#innerShadow)">
    <!-- Main broom head with gradient -->
    <rect x="-10" y="0" width="20" height="10" fill="url(#broomHead)" rx="2"/>
    
    <!-- Individual bristles with varying shades -->
    <g id="bristles">
      <rect x="-9" y="10" width="2.5" height="15" fill="#654321" rx="0.8" opacity="0.9"/>
      <rect x="-6" y="10" width="2.5" height="16" fill="#704214" rx="0.8" opacity="0.85"/>
      <rect x="-3" y="10" width="2.5" height="17" fill="#7a5219" rx="0.8" opacity="0.8"/>
      <rect x="0" y="10" width="2.5" height="17" fill="#704214" rx="0.8" opacity="0.85"/>
      <rect x="3" y="10" width="2.5" height="16" fill="#654321" rx="0.8" opacity="0.9"/>
      <rect x="6" y="10" width="2.5" height="15" fill="#5a3d1a" rx="0.8" opacity="0.95"/>
      
      <!-- Bristle tips with lighter color -->
      <rect x="-9" y="22" width="2.5" height="3" fill="#8B6331" rx="0.8" opacity="0.7"/>
      <rect x="-6" y="23" width="2.5" height="3" fill="#9b7341" rx="0.8" opacity="0.6"/>
      <rect x="-3" y="24" width="2.5" height="3" fill="#8B6331" rx="0.8" opacity="0.7"/>
      <rect x="0" y="24" width="2.5" height="3" fill="#9b7341" rx="0.8" opacity="0.6"/>
      <rect x="3" y="23" width="2.5" height="3" fill="#8B6331" rx="0.8" opacity="0.7"/>
      <rect x="6" y="22" width="2.5" height="3" fill="#7a5219" rx="0.8" opacity="0.8"/>
    </g>
  </g>
  
  <!-- Enhanced dust particles with more detail -->
  <g filter="url(#glow)">
    <!-- Large dust particle with inner structure -->
    <g transform="translate(25, 35)">
      <circle r="4" fill="#6b6b6b" opacity="0.8">
        <animate attributeName="r" values="4;4.2;4" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="2" fill="#888888" opacity="0.6"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 1,-1; 0,0" dur="3s" repeatCount="indefinite"/>
    </g>
    
    <!-- Medium dust particle -->
    <g transform="translate(85, 40)">
      <circle r="3.5" fill="#757575" opacity="0.7">
        <animate attributeName="r" values="3.5;3.7;3.5" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="1.5" fill="#999999" opacity="0.5"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; -1,0.5; 0,0" dur="2.5s" repeatCount="indefinite"/>
    </g>
    
    <!-- Small dust particle -->
    <g transform="translate(30, 75)">
      <circle r="2.5" fill="#808080" opacity="0.6">
        <animate attributeName="r" values="2.5;2.7;2.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle r="1" fill="#aaaaaa" opacity="0.4"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0.5,-0.5; 0,0" dur="2s" repeatCount="indefinite"/>
    </g>
    
    <!-- Tiny particle -->
    <circle cx="75" cy="70" r="1.8" fill="#9e9e9e" opacity="0.5">
      <animate attributeName="cy" values="70;68;70" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Enhanced cleaning swoosh lines -->
  <g stroke="#427A43" stroke-width="2" fill="none" opacity="0.5" filter="url(#glow)">
    <path d="M 15 80 Q 40 72, 60 75 T 105 70" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="2;2.5;2" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 20 85 Q 45 80, 65 82 T 100 78" stroke-linecap="round" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.05;0.3" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Sparkle effects for cleaning -->
  <g fill="#ffd700" opacity="0.6">
    <g transform="translate(40, 45)">
      <path d="M 0,-3 L 1,0 L 0,3 L -1,0 Z">
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M -3,0 L 0,-1 L 3,0 L 0,1 Z">
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <g transform="translate(80, 55)">
      <path d="M 0,-2 L 0.7,0 L 0,2 L -0.7,0 Z">
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <path d="M -2,0 L 0,-0.7 L 2,0 L 0,0.7 Z">
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
